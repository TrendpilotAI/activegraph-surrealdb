[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "activegraph-surrealdb"
version = "0.1.0a1"
description = "Research-preview SurrealDB event and graph stores for ActiveGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "TrendpilotAI" }]
keywords = ["activegraph", "event-sourcing", "graph", "surrealdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "activegraph==1.10.0",
  "surrealdb==2.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "twine>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/activegraph_surrealdb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
mypy_path = "src"
# ActiveGraph 1.10 exposes typed-looking classes without a PEP 561 marker.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["activegraph", "activegraph.*", "surrealdb", "surrealdb.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["activegraph_surrealdb"]

[tool.coverage.report]
show_missing = true
skip_covered = true
