name: SurrealDB qualification

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/integration/**"
      - "tests/qualification/**"
      - "pyproject.toml"
      - "compose.yaml"
      - ".github/workflows/qualification.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/integration/**"
      - "tests/qualification/**"
      - "pyproject.toml"
      - "compose.yaml"
      - ".github/workflows/qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: SurrealDB 3.2.4 / SDK 2.0.0 / WebSocket / RocksDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVEGRAPH_SURREALDB_TEST_URL: ws://127.0.0.1:8000
      ACTIVEGRAPH_SURREALDB_TEST_NAMESPACE: activegraph
      ACTIVEGRAPH_SURREALDB_TEST_DATABASE: provider_ci
      ACTIVEGRAPH_SURREALDB_TEST_USERNAME: root
      ACTIVEGRAPH_SURREALDB_TEST_PASSWORD: local-ci-only-not-a-secret
      ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER: activegraph-surrealdb-ci
      ACTIVEGRAPH_SURREALDB_DOCKER_VOLUME: activegraph-surrealdb-ci-data
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Start pinned SurrealDB
        run: |
          docker volume create "${ACTIVEGRAPH_SURREALDB_DOCKER_VOLUME}"
          docker run --rm --user 0:0 \
            --mount "type=volume,src=${ACTIVEGRAPH_SURREALDB_DOCKER_VOLUME},dst=/data,volume-nocopy" \
            busybox:1.37.0 chmod 0777 /data
          docker run --detach \
            --name "${ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER}" \
            --publish 127.0.0.1:8000:8000 \
            --mount "type=volume,src=${ACTIVEGRAPH_SURREALDB_DOCKER_VOLUME},dst=/data,volume-nocopy" \
            --env SURREAL_USER=root \
            --env "SURREAL_PASS=${ACTIVEGRAPH_SURREALDB_TEST_PASSWORD}" \
            surrealdb/surrealdb:v3.2.4 \
            start --bind 0.0.0.0:8000 rocksdb:///data/activegraph.db
      - name: Wait for SurrealDB
        run: |
          for _ in {1..60}; do
            if docker exec "${ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER}" \
              /surreal is-ready --endpoint http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER}"
          exit 1
      - name: Run live integration contracts
        run: python -m pytest -m surrealdb tests/integration
      - name: Run destructive qualification contracts
        env:
          ACTIVEGRAPH_SURREALDB_QUALIFY: "1"
        run: python -m pytest -m qualification tests/qualification
      - name: Capture server logs on failure
        if: failure()
        run: docker logs "${ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER}" || true
      - name: Remove disposable server
        if: always()
        run: |
          docker rm --force "${ACTIVEGRAPH_SURREALDB_DOCKER_CONTAINER}" || true
          docker volume rm "${ACTIVEGRAPH_SURREALDB_DOCKER_VOLUME}" || true
