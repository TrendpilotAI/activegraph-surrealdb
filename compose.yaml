name: activegraph-surrealdb

services:
  volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["chmod", "0777", "/data"]
    volumes:
      - type: volume
        source: surrealdb-data
        target: /data
        volume:
          nocopy: true

  surrealdb:
    image: &surrealdb_image surrealdb/surrealdb:v3.3.0
    container_name: ${SURREALDB_CONTAINER_NAME:-activegraph-surrealdb}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      SURREAL_USER: ${SURREALDB_USER:-root}
      SURREAL_PASS: ${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD in .env}
    command:
      - start
      - --bind
      - 0.0.0.0:8000
      - --log
      - ${SURREALDB_LOG:-info}
      - ${SURREALDB_ENGINE:-rocksdb}:///data/activegraph.db
    ports:
      - 127.0.0.1:${SURREALDB_PORT:-8000}:8000
    volumes:
      - type: volume
        source: surrealdb-data
        target: /data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

  surrealdb-tls:
    image: *surrealdb_image
    profiles: ["tls"]
    container_name: ${SURREALDB_TLS_CONTAINER_NAME:-activegraph-surrealdb-tls}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      SURREAL_USER: ${SURREALDB_USER:-root}
      SURREAL_PASS: ${SURREALDB_PASSWORD:?set SURREALDB_PASSWORD in .env}
    command:
      - start
      - --bind
      - 0.0.0.0:8000
      - --log
      - ${SURREALDB_LOG:-info}
      - --web-crt
      - /tls/tls.crt
      - --web-key
      - /tls/tls.key
      - ${SURREALDB_ENGINE:-rocksdb}:///data/activegraph.db
    ports:
      - 127.0.0.1:${SURREALDB_PORT:-8000}:8000
    volumes:
      - type: volume
        source: surrealdb-data
        target: /data
        volume:
          nocopy: true
      - type: bind
        source: ${SURREALDB_WEB_CRT:-./tls/tls.crt}
        target: /tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SURREALDB_WEB_KEY:-./tls/tls.key}
        target: /tls/tls.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "https://127.0.0.1:8000"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

volumes:
  surrealdb-data:
    name: ${SURREALDB_VOLUME:-activegraph-surrealdb-data}
